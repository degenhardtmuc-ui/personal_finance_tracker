[project]
name = "personal-finance-tracker"
version = "0.1.0"
description = "A personal finance tracker for income and expenses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
